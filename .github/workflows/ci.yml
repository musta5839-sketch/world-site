name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality-and-security:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: world_test
          POSTGRES_USER: world
          POSTGRES_PASSWORD: world_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U world -d world_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://world:world_test_password@localhost:5432/world_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full dependency audit
        run: npm audit

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Apply database migrations
        run: npm run db:migrate -- --database-url-var TEST_DATABASE_URL

      - name: Run tests
        run: npm test

      - name: Verify coverage thresholds
        run: npm run test:coverage
